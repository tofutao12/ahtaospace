<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHTAO // SPACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Prompt:wght@300;400&family=Sarabun:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #0c0c0c;
            --border-color: #222222;
            --text-main: #e1e1e1;
            --text-muted: #777777;
            --accent: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Sarabun', sans-serif;
            line-height: 1.9;
            overflow-x: hidden;
            letter-spacing: 0.3px;
        }

        h1, h2, h3 {
            font-family: 'Prompt', sans-serif;
            font-weight: 300;
            color: var(--accent);
        }

        /* --- Hero Section (Cinematic Banner) --- */
        .hero-section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .bg-video, .bg-image {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translateX(-50%) translateY(-50%);
            z-index: -2;
            opacity: 0.35;
            filter: grayscale(100%) contrast(150%) brightness(80%);
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(5,5,5,0.2) 0%, rgba(5,5,5,0.95) 100%);
            z-index: -1;
        }

        .hero-content { z-index: 1; padding: 20px; }
        
        /* ชื่อที่เอาไว้กด 3 ครั้ง */
        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(3rem, 6vw, 5rem);
            letter-spacing: 6px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer; /* เมาส์เปลี่ยนเป็นรูปมือเมื่อชี้ */
            user-select: none; /* ป้องกันการไฮไลท์ข้อความเวลาดับเบิลคลิก */
            transition: opacity 0.2s;
        }
        .hero-content h1:active { opacity: 0.5; }

        .hero-content p {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; }
        }

        /* --- Main Content Section --- */
        .content-section {
            max-width: 750px; margin: 0 auto; padding: 100px 20px;
        }

        .entry-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 50px; margin-bottom: 60px;
            position: relative;
            transition: border-color 0.4s ease, transform 0.4s ease;
        }
        .entry-card:hover { border-color: #444; transform: translateY(-2px); }

        .date {
            font-size: 0.75rem; color: var(--text-muted);
            display: block; margin-bottom: 20px;
            letter-spacing: 3px; text-transform: uppercase;
            font-family: 'Cinzel', serif;
        }
        .entry-card h2 { font-size: 1.5rem; margin-bottom: 25px; }
        .entry-card p { color: #cccccc; font-size: 1.05rem; margin-bottom: 20px; }

        .poem {
            font-family: 'Sarabun', serif; font-style: italic; color: #b8b8b8;
            padding: 30px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
            margin: 30px 0; line-height: 2.4; text-align: center; white-space: pre-line; font-size: 1.15rem;
        }

        .media-embed { margin-top: 30px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        .media-embed iframe { width: 100%; border: none; display: block; }

        /* --- Pop-up Modal สำหรับหลังบ้าน --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
        }

        .modal-content {
            background: #080808; border: 1px solid var(--border-color);
            padding: 40px; width: 100%; max-width: 600px;
            max-height: 90vh; overflow-y: auto; position: relative;
        }

        .modal-content h2 {
            font-size: 1.1rem; margin-bottom: 25px; letter-spacing: 2px;
            text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }

        .close-btn {
            position: absolute; top: 25px; right: 25px;
            background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;
        }

        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; }
        
        input, textarea, select {
            width: 100%; padding: 12px; background: #111; border: 1px solid var(--border-color);
            color: #fff; border-radius: 2px; margin-bottom: 20px; font-family: 'Sarabun', sans-serif; font-size: 0.9rem; outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #666; }

        button.submit-btn {
            background: #fff; color: #000; border: none; padding: 12px 25px;
            font-family: 'Cinzel', serif; font-weight: 600; font-size: 0.8rem;
            letter-spacing: 2px; cursor: pointer; text-transform: uppercase; width: 100%;
        }
        button.submit-btn:hover { background: #b8b8b8; }

        .form-block { margin-bottom: 30px; }

        footer {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
            font-size: 0.75rem; letter-spacing: 2px; border-top: 1px solid var(--border-color); text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- ส่วนแบนเนอร์ (คลิกที่ชื่อ 3 ครั้งเพื่อเปิดหลังบ้าน) -->
    <header class="hero-section" id="heroBanner">
        <div class="overlay"></div>
        <video autoplay loop muted playsinline class="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-rain-falling-on-the-water-of-a-lake-1562-large.mp4" type="video/mp4">
        </video>
        <div class="hero-content">
            <!-- จุดนี้คือที่ให้คลิก 3 ครั้ง -->
            <h1 id="brandTitle" onclick="handleTitleClick()" title="Secret Control">AHTAO</h1>
            <p id="brandSub">Fragments of Silence</p>
        </div>
        <div class="scroll-indicator">Scroll to explore</div>
    </header>

    <!-- ส่วนแสดงเนื้อหาโพสต์ -->
    <main class="content-section" id="postsContainer">
        <p style="text-align: center; color: var(--text-muted); font-style: italic;">Loading fragments...</p>
    </main>

    <!-- 🪟 Pop-up หลังบ้าน (ซ่อนอยู่ จะเด้งขึ้นมาเมื่อคลิกชื่อ 3 ครั้ง) -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdmin()">✕</button>
            
            <div class="form-block">
                <h2>Configure Banner</h2>
                <label>Banner Type</label>
                <select id="bannerType">
                    <option value="video">Video (.mp4)</option>
                    <option value="image">Image (.jpg / .png)</option>
                </select>
                <label>Media URL (Video or Image Link)</label>
                <input type="text" id="bannerUrl" placeholder="https://...">
                <label>Main Title</label>
                <input type="text" id="bannerTitleInput" value="AHTAO">
                <label>Subtitle</label>
                <input type="text" id="bannerSubInput" value="Fragments of Silence">
                <button class="submit-btn" onclick="saveBanner()">Update Banner</button>
            </div>

            <div class="form-block" style="margin-bottom: 0;">
                <h2>Create New Fragment</h2>
                <label>Type</label>
                <select id="postType">
                    <option value="text">General Thought</option>
                    <option value="poem">Poetry / Quote</option>
                    <option value="music">Soundtrack (Spotify)</option>
                </select>
                <label>Date / Period</label>
                <input type="text" id="postDate" placeholder="September 19, 2026">
                <label>Title</label>
                <input type="text" id="postTitle" placeholder="Fragment title...">
                <label>Content / Short Message</label>
                <textarea id="postContent" rows="3" placeholder="Write your brief thoughts..."></textarea>
                <label>Spotify Embed URL (Only for Music type)</label>
                <input type="text" id="postMediaUrl" placeholder="https://open.spotify.com/embed/track/...">
                <button class="submit-btn" onclick="createPost()">Publish Fragment</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; Ahtao Space. All rights reserved.</p>
    </footer>

    <!-- Script ระบบ Firebase และตัวจับคลิก 3 ครั้ง -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUsVYDVPbAfEwlmOqvLel8lbUsclZVxHo",
            authDomain: "ahtao-space.firebaseapp.com",
            projectId: "ahtao-space",
            storageBucket: "ahtao-space.firebasestorage.app",
            messagingSenderId: "946377925833",
            appId: "1:946377925833:web:6dbfb0110968d208695918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ระบบจับการคลิกชื่อ 3 ครั้งติดกัน
        let clickCount = 0;
        let clickTimer = null;

        window.handleTitleClick = function() {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => {
                    clickCount = 0; // รีเซ็ตถ้าคลิกช้าเกินไป (ภายใน 500 มิลลิวินาทีต้องคลิกให้ครบ)
                }, 500);
            } else if (clickCount === 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                document.getElementById("adminModal").style.display = "flex"; // เปิดป๊อปอัพ
            }
        }

        window.closeAdmin = function() {
            document.getElementById("adminModal").style.display = "none";
        }

        // โหลดแบนเนอร์
        async function loadBanner() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "banner"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const hero = document.getElementById("heroBanner");
                    if (data.url) {
                        let mediaHtml = data.type === "image" 
                            ? `<img src="${data.url}" class="bg-image" alt="Banner">`
                            : `<video autoplay loop muted playsinline class="bg-video"><source src="${data.url}" type="video/mp4"></video>`;

                        hero.innerHTML = `
                            <div class="overlay"></div>
                            ${mediaHtml}
                            <div class="hero-content">
                                <h1 id="brandTitle" onclick="handleTitleClick()">${data.title || 'AHTAO'}</h1>
                                <p>${data.subtitle || ''}</p>
                            </div>
                            <div class="scroll-indicator">Scroll to explore</div>
                        `;
                    }
                }
            } catch (e) { console.log("Default banner used"); }
        }

        // โหลดโพสต์
        async function loadPosts() {
            const container = document.getElementById("postsContainer");
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-style: italic;">No fragments recorded yet.</p>`;
                    return;
                }
                
                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    let contentHtml = "";

                    if (post.type === 'text') {
                        contentHtml = `<p>${post.content ? post.content.replace(/\n/g, '<br>') : ''}</p>`;
                    } else if (post.type === 'poem') {
                        contentHtml = `<div class="poem">${post.content || ''}</div>`;
                    } else if (post.type === 'music') {
                        contentHtml = `
                            <p>${post.content || ''}</p>
                            <div class="media-embed">
                                <iframe src="${post.mediaUrl || ''}" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <article class="entry-card">
                            <span class="date">${post.date || ''}</span>
                            ${post.title ? `<h2>${post.title}</h2>` : ''}
                            ${contentHtml}
                        </article>
                    `;
                });
            } catch (e) {
                container.innerHTML = `<p style="text-align: center; color: #ff6b6b;">Connecting to database...</p>`;
            }
        }

        window.saveBanner = async function() {
            const type = document.getElementById("bannerType").value;
            const url = document.getElementById("bannerUrl").value;
            const title = document.getElementById("bannerTitleInput").value;
            const subtitle = document.getElementById("bannerSubInput").value;
            try {
                await setDoc(doc(db, "settings", "banner"), { type, url, title, subtitle });
                alert("Banner updated.");
                location.reload();
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        window.createPost = async function() {
            const type = document.getElementById("postType").value;
            const date = document.getElementById("postDate").value;
            const title = document.getElementById("postTitle").value;
            const content = document.getElementById("postContent").value;
            const mediaUrl = document.getElementById("postMediaUrl").value;

            try {
                await addDoc(collection(db, "posts"), {
                    type, date, title, content, mediaUrl,
                    createdAt: new Date()
                });
                alert("Fragment published.");
                location.reload();
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        loadBanner();
        loadPosts();
    </script>
</body>
</html>
