<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHTAO SPACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Prompt:wght@300;400&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808; --surface-color: transparent;
            --border-color: rgba(255, 255, 255, 0.1); --text-main: #e1e1e1;
            --text-muted: #888888; --accent: #ffffff;
        }

        /* ล็อกการคลุมดำและคัดลอกข้อความบนหน้าเว็บทั้งหมด */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE10+/Edge */
            user-select: none;         /* Standard */
        }

        /* ยกเว้นให้พิมพ์ในช่องกรอกหลังบ้านได้ปกติ */
        input, textarea, select {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Sarabun', sans-serif; line-height: 1.9;
            overflow-x: hidden; letter-spacing: 0.3px; position: relative;
        }

        h1, h2, h3 { font-family: 'Prompt', sans-serif; font-weight: 300; color: var(--accent); }

        /* --- ละอองบรรยากาศลอยเบาๆ --- */
        .ambient-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden; opacity: 0.3;
        }
        .particle {
            position: absolute; background: #fff; border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* --- แบนเนอร์ฉากหลัง --- */
        .hero-section {
            position: relative; height: 100vh; display: flex;
            align-items: center; justify-content: center;
            text-align: center; overflow: hidden;
            border-bottom: 1px solid var(--border-color); z-index: 1;
        }

        .bg-video, .bg-image {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translateX(-50%) translateY(-50%);
            z-index: -2; opacity: 0.8;
            filter: grayscale(80%) contrast(105%) brightness(85%);
            object-fit: cover;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.4); z-index: -1;
        }

        .hero-content { z-index: 1; padding: 20px; }
        .hero-content h1 {
            font-family: 'Cinzel', serif; font-size: clamp(3rem, 7vw, 5rem);
            letter-spacing: 6px; margin-bottom: 15px; text-transform: uppercase;
            color: #ffffff; text-shadow: 0 4px 15px rgba(0,0,0,0.7);
            cursor: pointer; user-select: none; transition: opacity 0.2s;
        }
        .hero-content h1:active { opacity: 0.5; }
        .hero-content p {
            color: #e0e0e0; font-size: 1.1rem; letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8); margin-bottom: 40px; font-weight: 300;
        }

        .scroll-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            color: #aaaaaa; font-size: 0.75rem; letter-spacing: 3px;
            text-transform: uppercase; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* --- ส่วนแสดงโพสต์ชิดซ้าย --- */
        .content-section { max-width: 650px; margin: 0 auto; padding: 60px 20px; z-index: 1; position: relative; }
        .entry-card {
            background: transparent; border: none;
            padding: 20px 0; margin-bottom: 50px; position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: left;
        }
        .date {
            font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 10px;
            letter-spacing: 3px; text-transform: uppercase; font-family: 'Cinzel', serif;
        }
        .entry-card p { color: #d0d0d0; font-size: 1.05rem; margin-bottom: 15px; text-align: left; }
        .post-image {
            width: 100%; border-radius: 6px; margin-bottom: 20px;
            object-fit: cover; border: 1px solid rgba(255,255,255,0.1); max-height: 450px;
        }
        .poem {
            font-family: 'Sarabun', serif; font-style: italic; color: #dfdfdf;
            padding: 10px 0; margin: 10px 0; line-height: 2.3; text-align: left;
            white-space: pre-line; font-size: 1.15rem;
        }
        
        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .post-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .post-tag {
            background: rgba(255,255,255,0.05); color: #999;
            padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;
            letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.08);
        }

        .post-actions { display: flex; gap: 12px; align-items: center; }
        .action-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #aaa;
            padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer;
            display: flex; align-items: center; gap: 5px; transition: all 0.2s;
            font-family: 'Sarabun', sans-serif;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.3); }

        .delete-btn {
            display: none; background: none; border: none;
            color: #ff6b6b; font-size: 0.8rem; cursor: pointer;
            margin-left: 10px;
        }
        body.logged-in .delete-btn { display: inline-block; }

        .blur-content {
            filter: blur(8px); opacity: 0.6; transition: filter 0.4s ease, opacity 0.4s ease;
            cursor: pointer; position: relative; text-align: left;
        }
        .blur-content:hover, .blur-content:active { filter: blur(0); opacity: 1; }
        .blur-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 6px 14px; border-radius: 20px;
            font-size: 0.75rem; letter-spacing: 1px; pointer-events: none;
        }

        /* --- หลังบ้านแบ่ง 2 โซนชัดเจน --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 15px;
        }
        .modal-content {
            background: #0d0d0d; border: 1px solid var(--border-color);
            padding: 30px 20px; width: 100%; max-width: 600px;
            max-height: 90vh; overflow-y: auto; border-radius: 8px; position: relative; text-align: left;
        }
        .modal-content h2 { font-size: 1.1rem; margin-bottom: 5px; color: #fff; }
        .section-desc { font-size: 0.8rem; color: #666; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .admin-zone { background: #141414; border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 6px; margin-bottom: 25px; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 1px; margin-top: 12px; }
        input, textarea, select {
            width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid var(--border-color);
            color: #fff; border-radius: 4px; margin-bottom: 5px; font-family: 'Sarabun', sans-serif; font-size: 0.9rem; outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #555; }
        
        .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; margin-bottom: 15px; }
        .q-tag-chip {
            background: #1c1c1c; border: 1px solid #333; color: #aaa; padding: 4px 10px;
            border-radius: 15px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
        }
        .q-tag-chip:hover { background: #333; color: #fff; border-color: #555; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 15px 0 15px 0; cursor: pointer; }
        .checkbox-group input { width: auto; margin: 0; transform: scale(1.2); cursor: pointer; }
        .checkbox-group label { margin: 0; cursor: pointer; color: #ccc; text-transform: none; font-size: 0.85rem; }
        
        button.submit-btn {
            background: #fff; color: #000; border: none; padding: 12px 20px; border-radius: 4px;
            font-family: 'Cinzel', serif; font-weight: 600; font-size: 0.8rem;
            letter-spacing: 2px; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px;
            transition: background 0.2s;
        }
        button.submit-btn:hover { background: #d0d0d0; }
        footer { text-align: center; padding: 50px 20px; color: #444; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; z-index: 1; position: relative; }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- ป้องกันคลิกขวา -->

    <div class="ambient-particles" id="ambientParticles"></div>

    <header class="hero-section" id="heroBanner">
        <div class="overlay"></div>
        <div id="heroBgContainer">
            <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?q=80&w=1000&auto=format&fit=crop" class="bg-image" alt="Banner">
        </div>
        <div class="hero-content">
            <h1 id="brandTitle" onclick="handleTitleClick()" title="คลิกเพื่อเข้าหลังบ้าน">AHTAO SPACE</h1>
            <p id="brandSub">แค่เพียงเต้าหู้ที่ถูกกัดกิน เพียงเท่านั้น</p>
        </div>
        <div class="scroll-indicator">เลื่อนลงเพื่ออ่าน</div>
    </header>

    <main class="content-section" id="postsContainer">
        <p style="text-align: center; color: var(--text-muted); font-style: italic;">กำลังโหลดความรู้สึก...</p>
    </main>

    <!-- หลังบ้านแบ่งเป็น 2 โซนชัดเจน -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAdmin()">✕</button>
            
            <h2>หลังบ้าน AHTAO SPACE</h2>
            <div class="section-desc">จัดการสเปซและความรู้สึกของคุณ</div>

            <!-- โซนที่ 1: ตั้งค่าแบนเนอร์/บรรยากาศ -->
            <div class="admin-zone">
                <h3 style="font-size: 0.95rem; color: #fff; margin-bottom: 10px;">🌄 โซนที่ 1: ตั้งค่าภาพฉากหลัง</h3>
                <label>ลิงก์รูปภาพฉากหลัง (รองรับ Google Drive)</label>
                <input type="text" id="bannerUrlInput" placeholder="วางลิงก์รูปภาพ...">
                <button class="submit-btn" style="background: #222; color: #fff; border: 1px solid #444;" onclick="saveBannerData()">อัปเดตภาพแบนเนอร์</button>
            </div>

            <!-- โซนที่ 2: สร้างโพสต์ความรู้สึกใหม่ -->
            <div class="admin-zone">
                <h3 style="font-size: 0.95rem; color: #fff; margin-bottom: 10px;">✍️ โซนที่ 2: สร้างความรู้สึกใหม่</h3>
                
                <label>รูปแบบข้อความ</label>
                <select id="postType">
                    <option value="text">บันทึกทั่วไป (ชิดซ้าย)</option>
                    <option value="poem">บทกวี (ตัวเอียง ชิดซ้าย)</option>
                </select>

                <label>รูปภาพประกอบโพสต์ (ถ้ามี)</label>
                <input type="text" id="postImageUrl" placeholder="วางลิงก์รูปภาพ...">

                <label>เนื้อหา / ความรู้สึก *</label>
                <textarea id="postContent" rows="4" placeholder="พิมพ์ความรู้สึกของคุณที่นี่..."></textarea>

                <label>ป้ายกำกับ (แท็กอารมณ์)</label>
                <input type="text" id="postTags" placeholder="เช่น #คิดถึง, #ฝนตก">
                <div class="quick-tags">
                    <span class="q-tag-chip" onclick="addTag('#คิดถึง')">#คิดถึง</span>
                    <span class="q-tag-chip" onclick="addTag('#ฝนตก')">#ฝนตก</span>
                    <span class="q-tag-chip" onclick="addTag('#ความเหงา')">#ความเหงา</span>
                    <span class="q-tag-chip" onclick="addTag('#บันทึก')">#บันทึก</span>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="postBlur">
                    <label for="postBlur">ซ่อนความรู้สึกนี้ (ทำให้เบลอ)</label>
                </div>

                <button class="submit-btn" onclick="createPost()">บันทึกความรู้สึก</button>
            </div>
        </div>
    </div>

    <footer><p>&copy; AHTAO SPACE.</p></footer>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc, deleteDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUsVYDVPbAfEwlmOqvLel8lbUsclZVxHo",
            authDomain: "ahtao-space.firebaseapp.com",
            projectId: "ahtao-space",
            storageBucket: "ahtao-space.firebasestorage.app",
            messagingSenderId: "946377925833",
            appId: "1:946377925833:web:6dbfb0110968d208695918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ADMIN_PASS = "1164";
        const SITE_URL = "https://ahtaospace.pages.dev/";

        if (sessionStorage.getItem('ahtao_admin_auth') === 'true') {
            document.body.classList.add('logged-in');
        }

        function convertDriveLink(url) {
            if (!url) return "";
            if (url.includes("drive.google.com")) {
                let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        function initParticles() {
            const container = document.getElementById("ambientParticles");
            container.innerHTML = "";
            for(let i=0; i<12; i++) {
                let p = document.createElement("div");
                p.className = "particle";
                let size = Math.random() * 3 + 1;
                p.style.width = size + "px";
                p.style.height = size + "px";
                p.style.left = Math.random() * 100 + "vw";
                p.style.animationDuration = (Math.random() * 10 + 8) + "s";
                p.style.animationDelay = (Math.random() * 5) + "s";
                container.appendChild(p);
            }
        }

        // คลิก 1 ครั้ง เปิดหลังบ้าน
        window.handleTitleClick = function() {
            if (sessionStorage.getItem('ahtao_admin_auth') === 'true') {
                document.getElementById("adminModal").style.display = "flex";
            } else {
                let pass = prompt("🔐 กรุณากรอกรหัสผ่านเพื่อเข้าสู่หลังบ้าน:");
                if (pass === ADMIN_PASS) {
                    sessionStorage.setItem('ahtao_admin_auth', 'true');
                    document.body.classList.add('logged-in');
                    document.getElementById("adminModal").style.display = "flex";
                } else if (pass !== null) {
                    alert("❌ รหัสผ่านไม่ถูกต้อง");
                }
            }
        }

        window.closeAdmin = function() { document.getElementById("adminModal").style.display = "none"; }

        window.addTag = function(tag) {
            const input = document.getElementById("postTags");
            input.value = input.value ? input.value + ", " + tag : tag;
        }

        // โหลดแบนเนอร์
        async function fetchBanner() {
            try {
                const snap = await getDoc(doc(db, "settings", "banner"));
                if(snap.exists()) {
                    let d = snap.data();
                    if(d.url) {
                        document.querySelector(".bg-image").src = convertDriveLink(d.url);
                        document.getElementById("bannerUrlInput").value = d.rawUrl || d.url;
                    }
                }
            } catch(e) {}
        }

        window.saveBannerData = async function() {
            let rawUrl = document.getElementById("bannerUrlInput").value.trim();
            let url = convertDriveLink(rawUrl);
            try {
                await setDoc(doc(db, "settings", "banner"), { url, rawUrl });
                alert("อัปเดตภาพแบนเนอร์สำเร็จ!");
                location.reload();
            } catch(e) { alert("เกิดข้อผิดพลาด: " + e.message); }
        }

        async function loadPosts() {
            const container = document.getElementById("postsContainer");
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-style: italic;">พื้นที่ยังว่างเปล่า...</p>`;
                    return;
                }
                
                let postsArray = [];
                querySnapshot.forEach((docSnap) => { postsArray.push({ id: docSnap.id, ...docSnap.data() }); });
                postsArray.reverse();

                // รายการวันที่สุ่มสำหรับโพสต์เก่าๆ (18/09 - 21/09)
                const randomDates = [
                    "18 กันยายน 2026",
                    "19 กันยายน 2026",
                    "20 กันยายน 2026",
                    "21 กันยายน 2026"
                ];

                container.innerHTML = "";
                postsArray.forEach((post, index) => {
                    let textHtml = "";
                    if (post.type === 'poem') {
                        textHtml = `<div class="poem">${post.content ? post.content.replace(/\n/g, '<br>') : ''}</div>`;
                    } else {
                        textHtml = `<p>${post.content ? post.content.replace(/\n/g, '<br>') : ''}</p>`;
                    }

                    let imgHtml = post.imageUrl ? `<img src="${convertDriveLink(post.imageUrl)}" class="post-image" alt="Memory" loading="lazy">` : '';
                    let tagsHtml = "";
                    if (post.tags) {
                        const tagsList = post.tags.split(',').map(tag => tag.trim()).filter(tag => tag);
                        tagsHtml = `<div class="post-tags">${tagsList.map(tag => `<span class="post-tag">${tag}</span>`).join('')}</div>`;
                    }

                    let contentWrapper = post.isBlurred 
                        ? `<div class="blur-content"><div class="blur-hint">แตะเพื่อดูความรู้สึก</div>${imgHtml}${textHtml}</div>` 
                        : `${imgHtml}${textHtml}`;

                    let hugsCount = post.hugs || 0;
                    // ถ้าโพสต์ไม่มีวันที่ ให้สุ่มใส่วันที่ช่วง 18/09 - 21/09
                    let displayDate = post.date || randomDates[index % randomDates.length];

                    container.innerHTML += `
                        <article class="entry-card">
                            <span class="date">${displayDate}</span>
                            ${contentWrapper}
                            <div class="post-footer">
                                ${tagsHtml}
                                <div class="post-actions">
                                    <button class="action-btn" onclick="sendHug('${post.id}')" title="ส่งกอด">🤍 <span id="hug-count-${post.id}">${hugsCount}</span></button>
                                    <button class="action-btn" onclick="shareAsCard(this)" title="แชร์เป็นการ์ดรูปภาพ">📤 แชร์</button>
                                    <button class="delete-btn" onclick="deletePost('${post.id}')" title="ลบโพสต์">✕ ลบ</button>
                                </div>
                            </div>
                        </article>
                    `;
                });
            } catch (e) { container.innerHTML = `<p style="text-align: center; color: #ff6b6b;">ไม่สามารถโหลดข้อมูลได้...</p>`; }
        }

        window.sendHug = async function(id) {
            try {
                const postRef = doc(db, "posts", id);
                await updateDoc(postRef, { hugs: increment(1) });
                const countSpan = document.getElementById(`hug-count-${id}`);
                if(countSpan) countSpan.innerText = parseInt(countSpan.innerText || 0) + 1;
            } catch(e) {}
        }

        // ระบบแชร์: สร้างเป็นการ์ดรูปภาพพร้อมฝังเครดิตและลิงก์เว็บถาวร (ลบไม่ออก)
        window.shareAsCard = function(btn) {
            const card = btn.closest('.entry-card');
            const textEl = card.querySelector('p, .poem');
            const poemText = textEl ? textEl.innerText : "";

            // สร้าง Canvas วาดภาพการ์ดบทกวี
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1080; // สัดส่วนสี่เหลี่ยมจัตุรัส เหมาะกับ IG Story / Facebook
            const ctx = canvas.getContext('2d');

            // พื้นหลังดาร์กมินิมอล
            ctx.fillStyle = "#0c0c0c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ขอบกรอบการ์ดบางๆ
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            // วาดข้อความบทกวีตรงกลาง
            ctx.fillStyle = "#e1e1e1";
            ctx.font = "italic 42px 'Sarabun', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // ฟังก์ชันตัดคำขึ้นบรรทัดใหม่ใน Canvas
            function wrapText(context, text, x, y, maxWidth, lineHeight) {
                let paragraphs = text.split('\n');
                let lines = [];
                for (let p of paragraphs) {
                    let words = p.split(' ');
                    let line = '';
                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        let metrics = context.measureText(testLine);
                        let testWidth = metrics.width;
                        if (testWidth > maxWidth && n > 0) {
                            lines.push(line);
                            line = words[n] + ' ';
                        } else {
                            line = testLine;
                        }
                    }
                    lines.push(line);
                }
                let startY = y - (lines.length * lineHeight) / 2;
                for (let k = 0; k < lines.length; k++) {
                    context.fillText(lines[k], x, startY + (k * lineHeight));
                }
            }

            wrapText(ctx, poemText, canvas.width / 2, canvas.height / 2 - 40, 850, 75);

            // วาดเครดิตและลิงก์เว็บด้านล่างสุด (ฝังติดไปกับภาพ ลบออกไม่ได้)
            ctx.fillStyle = "#888888";
            ctx.font = "300 24px 'Sarabun', sans-serif";
            ctx.fillText("✦ AHTAO SPACE", canvas.width / 2, canvas.height - 140);

            ctx.fillStyle = "#555555";
            ctx.font = "20px 'Cinzel', serif";
            ctx.fillText(SITE_URL, canvas.width / 2, canvas.height - 100);

            // แปลง Canvas เป็นไฟล์รูปภาพแล้วดาวน์โหลด/แชร์อัตโนมัติ
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "Ahtao-Space-Poem.png", { type: "image/png" });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'AHTAO SPACE',
                            text: 'ความรู้สึกจาก AHTAO SPACE'
                        });
                        return;
                    } catch (err) { console.log("Share cancelled"); }
                }

                // ถ้ามือถือ/เบราว์เซอร์ไม่รองรับการแชร์ไฟล์โดยตรง จะทำการดาวน์โหลดภาพลงเครื่องทันที
                const link = document.createElement('a');
                link.download = 'ahtao-space-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                alert("📥 สร้างการ์ดรูปภาพบทกวีพร้อมเครดิตเว็บเรียบร้อยแล้ว!\nสามารถนำรูปไปโพสต์ลง IG Story ได้เลยค่ะ");
            }, 'image/png');
        }

        window.createPost = async function() {
            const type = document.getElementById("postType").value;
            const imageUrl = document.getElementById("postImageUrl").value.trim();
            const content = document.getElementById("postContent").value.trim();
            const tags = document.getElementById("postTags").value.trim();
            const isBlurred = document.getElementById("postBlur").checked;

            if(!content && !imageUrl) {
                alert("กรุณากรอกเนื้อหาหรือใส่รูปภาพอย่างน้อยหนึ่งอย่างค่ะ");
                return;
            }

            // วันที่ปัจจุบัน
            const today = new Date();
            const date = today.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

            try {
                await addDoc(collection(db, "posts"), {
                    type, date, imageUrl, content, tags, isBlurred,
                    hugs: 0,
                    createdAt: new Date()
                });
                alert("บันทึกความรู้สึกสำเร็จ!");
                location.reload();
            } catch (e) { alert("เกิดข้อผิดพลาด: " + e.message); }
        }

        initParticles();
        fetchBanner();
        loadPosts();
    </script>
</body>
</html>
