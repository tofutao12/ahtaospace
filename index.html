<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHTAO SPACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Prompt:wght@300;400&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080808; --surface-color: transparent;
            --border-color: rgba(255, 255, 255, 0.1); --text-main: #e1e1e1;
            --text-muted: #888888; --accent: #ffffff;
        }

        /* ล็อกการคลุมดำและคัดลอกข้อความบนหน้าเว็บ */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; 
        }
        input, textarea, select { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Sarabun', sans-serif; line-height: 1.9;
            overflow-x: hidden; letter-spacing: 0.3px; position: relative;
            transition: background-color 0.8s ease;
        }

        h1, h2, h3 { font-family: 'Prompt', sans-serif; font-weight: 300; color: var(--accent); }

        /* --- ละอองบรรยากาศลอยเบาๆ --- */
        .ambient-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden; opacity: 0.3;
        }
        .particle {
            position: absolute; background: #fff; border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* --- เมนูด้านบนขวา (3 โหมด + ปุ่มสุ่มความทรงจำ) --- */
        .top-controls { position: fixed; top: 20px; right: 20px; z-index: 999; display: flex; gap: 10px; align-items: center; }
        .glass-btn {
            background: rgba(15, 15, 15, 0.5); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ccc; padding: 10px 16px; border-radius: 30px;
            font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(10px); transition: all 0.3s ease;
            font-family: 'Sarabun', sans-serif; letter-spacing: 1px;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .mood-menu {
            display: none; position: absolute; top: 120%; right: 0;
            background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 8px; backdrop-filter: blur(15px);
            width: max-content; min-width: 160px;
            flex-direction: column; gap: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000;
        }
        .mood-menu.show { display: flex; }
        .menu-item {
            background: transparent; border: none; color: #aaa; padding: 10px 14px;
            text-align: left; font-family: 'Sarabun', sans-serif; font-size: 0.85rem;
            cursor: pointer; border-radius: 8px; transition: all 0.2s;
        }
        .menu-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .menu-item.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 500; }

        /* --- แบนเนอร์ฉากหลัง --- */
        .hero-section {
            position: relative; height: 100vh; display: flex;
            align-items: center; justify-content: center;
            text-align: center; overflow: hidden;
            border-bottom: 1px solid var(--border-color); z-index: 1;
        }
        .bg-image {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translateX(-50%) translateY(-50%);
            z-index: -2; opacity: 0.8;
            filter: grayscale(80%) contrast(105%) brightness(85%);
            object-fit: cover; transition: filter 0.8s ease;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.35); z-index: -1; transition: background 0.8s ease;
        }
        body.theme-midnight .overlay { background: rgba(0, 5, 15, 0.75); }
        body.theme-midnight .bg-image { filter: grayscale(90%) contrast(120%) brightness(50%); }
        body.theme-warm .overlay { background: rgba(30, 15, 0, 0.5); }
        body.theme-warm .bg-image { filter: sepia(40%) contrast(110%) brightness(75%); }

        .hero-content { z-index: 1; padding: 20px; }
        .hero-content h1 {
            font-family: 'Cinzel', serif; font-size: clamp(3rem, 7vw, 5rem);
            letter-spacing: 6px; margin-bottom: 15px; text-transform: uppercase;
            color: #ffffff; text-shadow: 0 4px 15px rgba(0,0,0,0.7);
            cursor: pointer; user-select: none; transition: opacity 0.2s;
        }
        .hero-content h1:active { opacity: 0.5; }
        .hero-content p {
            color: #e0e0e0; font-size: 1.1rem; letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8); margin-bottom: 40px; font-weight: 300;
        }

        .scroll-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            color: #aaaaaa; font-size: 0.75rem; letter-spacing: 3px;
            text-transform: uppercase; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* --- ส่วนแสดงโพสต์ --- */
        .content-section { max-width: 650px; margin: 0 auto; padding: 60px 20px; z-index: 1; position: relative; }
        .entry-card {
            background: transparent; border: none;
            padding: 10px 0; margin-bottom: 35px; position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }
        .date {
            font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 8px;
            letter-spacing: 3px; text-transform: uppercase; font-family: 'Cinzel', serif;
        }
        .entry-card p { color: #d0d0d0; font-size: 1.05rem; margin-bottom: 15px; text-align: left; }
        .post-image {
            width: 100%; border-radius: 6px; margin-bottom: 15px;
            object-fit: cover; border: 1px solid rgba(255,255,255,0.1); max-height: 450px;
        }
        .poem {
            font-family: 'Sarabun', serif; font-style: italic; color: #dfdfdf;
            padding: 8px 0; margin: 8px 0; line-height: 2.2; text-align: left;
            white-space: pre-line; font-size: 1.15rem;
        }
        
        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .post-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .post-tag {
            background: rgba(255,255,255,0.05); color: #999;
            padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;
            letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.08);
        }

        .post-actions { display: flex; gap: 10px; align-items: center; }
        .action-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #aaa;
            padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer;
            display: flex; align-items: center; gap: 5px; transition: all 0.2s;
            font-family: 'Sarabun', sans-serif;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.3); }

        .delete-btn {
            display: none; background: none; border: none; color: #ff6b6b; font-size: 0.8rem; cursor: pointer; margin-left: 8px;
        }
        body.logged-in .delete-btn { display: inline-block; }

        .blur-content {
            filter: blur(8px); opacity: 0.6; transition: filter 0.4s ease, opacity 0.4s ease;
            cursor: pointer; position: relative; text-align: left;
        }
        .blur-content:hover, .blur-content:active { filter: blur(0); opacity: 1; }
        .blur-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 6px 14px; border-radius: 20px;
            font-size: 0.75rem; letter-spacing: 1px; pointer-events: none;
        }

        /* --- หลังบ้านแบ่ง 2 ฝั่ง ซ้าย-ขวา --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 15px;
        }
        .modal-content {
            background: #0d0d0d; border: 1px solid var(--border-color);
            padding: 30px; width: 100%; max-width: 900px;
            max-height: 90vh; overflow-y: auto; border-radius: 8px; position: relative; text-align: left;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .modal-header h2 { font-size: 1.1rem; color: #fff; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
        
        .admin-pane { background: #141414; border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 6px; }
        .admin-pane h3 { font-size: 0.95rem; color: #fff; margin-bottom: 12px; }

        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 1px; margin-top: 10px; }
        input, textarea, select {
            width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid var(--border-color);
            color: #fff; border-radius: 4px; margin-bottom: 5px; font-family: 'Sarabun', sans-serif; font-size: 0.85rem; outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: #555; }
        
        .quick-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; margin-bottom: 10px; }
        .q-tag-chip {
            background: #1c1c1c; border: 1px solid #333; color: #aaa; padding: 3px 8px;
            border-radius: 15px; font-size: 0.7rem; cursor: pointer; transition: all 0.2s;
        }
        .q-tag-chip:hover { background: #333; color: #fff; border-color: #555; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 12px 0; cursor: pointer; }
        .checkbox-group input { width: auto; margin: 0; transform: scale(1.1); cursor: pointer; }
        .checkbox-group label { margin: 0; cursor: pointer; color: #ccc; text-transform: none; font-size: 0.8rem; }
        
        button.submit-btn {
            background: #fff; color: #000; border: none; padding: 11px 20px; border-radius: 4px;
            font-family: 'Cinzel', serif; font-weight: 600; font-size: 0.75rem;
            letter-spacing: 2px; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: 10px;
            transition: background 0.2s;
        }
        button.submit-btn:hover { background: #d0d0d0; }
        footer { text-align: center; padding: 40px 20px; color: #444; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; z-index: 1; position: relative; }
    </style>
</head>
<body class="theme-rain" oncontextmenu="return false;">

    <div class="ambient-particles" id="ambientParticles"></div>

    <div class="top-controls">
        <button class="glass-btn" onclick="randomMemory()" title="สุ่มอ่านความรู้สึกในอดีต">🌠 สุ่มความทรงจำ</button>
        <div style="position: relative;">
            <button class="glass-btn" onclick="toggleMoodMenu()">🎧 บรรยากาศ</button>
            <div class="mood-menu" id="moodMenu">
                <button class="menu-item active" id="btn-rain" onclick="setMode('rain')">🌧️ ฤดูฝน</button>
                <button class="menu-item" id="btn-midnight" onclick="setMode('midnight')">🌒 ราตรีสงัด</button>
                <button class="menu-item" id="btn-warm" onclick="setMode('warm')">🕯️ แสงเทียน</button>
            </div>
        </div>
    </div>

    <header class="hero-section" id="heroBanner">
        <div class="overlay"></div>
        <img src="" class="bg-image" id="bgImageElement" alt="Banner">
        <div class="hero-content">
            <h1 id="brandTitle" onclick="handleTitleClick()" title="คลิกเพื่อเข้าหลังบ้าน">AHTAO SPACE</h1>
            <p id="brandSub">แค่เพียงเต้าหู้ที่ถูกกัดกิน เพียงเท่านั้น</p>
        </div>
        <div class="scroll-indicator">เลื่อนลงเพื่ออ่าน</div>
    </header>

    <main class="content-section" id="postsContainer">
        <p style="text-align: center; color: var(--text-muted); font-style: italic;">กำลังโหลดความรู้สึก...</p>
    </main>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>หลังบ้าน AHTAO SPACE</h2>
                <button class="close-btn" onclick="closeAdmin()">✕</button>
            </div>

            <div class="admin-grid">
                <div class="admin-pane">
                    <h3>🌄 ฝั่งซ้าย: ตั้งค่าหน้าเว็บ (แบนเนอร์)</h3>
                    
                    <label>เลือกโหมดที่ต้องการแก้ไขภาพฉากหลัง</label>
                    <select id="adminThemeSelect" onchange="loadAdminThemeFields()">
                        <option value="rain">🌧️ โหมดฤดูฝน (Rain)</option>
                        <option value="midnight">🌒 โหมดราตรีสงัด (Midnight)</option>
                        <option value="warm">🕯️ โหมดแสงเทียน (Warm)</option>
                    </select>

                    <label>ลิงก์รูปภาพฉากหลัง (Google Drive / ลิงก์ตรง)</label>
                    <input type="text" id="bannerUrlInput" placeholder="วางลิงก์รูปภาพ...">

                    <button class="submit-btn" style="background: #222; color: #fff; border: 1px solid #444;" onclick="saveBannerData()">อัปเดตแบนเนอร์โหมดนี้</button>
                </div>

                <div class="admin-pane">
                    <h3>✍️ ฝั่งขวา: สร้างความรู้สึกใหม่</h3>

                    <label>รูปแบบข้อความ</label>
                    <select id="postType">
                        <option value="text">บันทึกทั่วไป (ชิดซ้าย)</option>
                        <option value="poem">บทกวี (ตัวเอียง ชิดซ้าย)</option>
                    </select>

                    <label>รูปภาพประกอบโพสต์ (ถ้ามี)</label>
                    <input type="text" id="postImageUrl" placeholder="วางลิงก์รูปภาพ...">

                    <label>เนื้อหา / ความรู้สึก *</label>
                    <textarea id="postContent" rows="3" placeholder="พิมพ์ความรู้สึกของคุณที่นี่..."></textarea>

                    <label>ป้ายกำกับ (แท็กอารมณ์)</label>
                    <input type="text" id="postTags" placeholder="เช่น #คิดถึง, #ฝนตก">
                    <div class="quick-tags">
                        <span class="q-tag-chip" onclick="addTag('#คิดถึง')">#คิดถึง</span>
                        <span class="q-tag-chip" onclick="addTag('#ฝนตก')">#ฝนตก</span>
                        <span class="q-tag-chip" onclick="addTag('#ความเหงา')">#ความเหงา</span>
                        <span class="q-tag-chip" onclick="addTag('#บันทึก')">#บันทึก</span>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="postBlur">
                        <label for="postBlur">ซ่อนความรู้สึกนี้ (ทำให้เบลอ)</label>
                    </div>

                    <button class="submit-btn" onclick="createPost()">บันทึกความรู้สึก</button>
                </div>
            </div>
        </div>
    </div>

    <footer><p>&copy; AHTAO SPACE.</p></footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc, deleteDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUsVYDVPbAfEwlmOqvLel8lbUsclZVxHo",
            authDomain: "ahtao-space.firebaseapp.com",
            projectId: "ahtao-space",
            storageBucket: "ahtao-space.firebasestorage.app",
            messagingSenderId: "946377925833",
            appId: "1:946377925833:web:6dbfb0110968d208695918"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ADMIN_PASS = "1164";
        const SITE_URL = "https://ahtaospace.pages.dev/";

        let currentMode = localStorage.getItem('ahtao_saved_mode') || 'rain';
        let themesData = {
            rain: { title: 'AHTAO SPACE', subtitle: 'แค่เพียงเต้าหู้ที่ถูกกัดกิน เพียงเท่านั้น', url: 'https://images.unsplash.com/photo-1518495973542-4542c06a5843?q=80&w=1000&auto=format&fit=crop' },
            midnight: { title: 'AHTAO SPACE', subtitle: 'ความว่างเปล่าในราตรี', url: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1000&auto=format&fit=crop' },
            warm: { title: 'AHTAO SPACE', subtitle: 'ความอบอุ่นในความเงียบ', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop' }
        };

        if (sessionStorage.getItem('ahtao_admin_auth') === 'true') {
            document.body.classList.add('logged-in');
        }

        function convertDriveLink(url) {
            if (!url) return "";
            if (url.includes("drive.google.com")) {
                let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        function initParticles() {
            const container = document.getElementById("ambientParticles");
            container.innerHTML = "";
            for(let i=0; i<12; i++) {
                let p = document.createElement("div");
                p.className = "particle";
                let size = Math.random() * 3 + 1;
                p.style.width = size + "px";
                p.style.height = size + "px";
                p.style.left = Math.random() * 100 + "vw";
                p.style.animationDuration = (Math.random() * 10 + 8) + "s";
                p.style.animationDelay = (Math.random() * 5) + "s";
                container.appendChild(p);
            }
        }

        window.toggleMoodMenu = function() { document.getElementById("moodMenu").classList.toggle("show"); }
        window.onclick = function(event) {
            if (!event.target.closest('.top-controls')) {
                document.getElementById("moodMenu").classList.remove('show');
            }
        }

        window.setMode = function(mode) {
            currentMode = mode;
            localStorage.setItem('ahtao_saved_mode', mode);

            document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
            let activeBtn = document.getElementById('btn-' + mode);
            if(activeBtn) activeBtn.classList.add('active');
            
            document.getElementById("moodMenu").classList.remove("show");
            document.body.className = `theme-${mode}`;
            if (document.body.classList.contains('logged-in')) document.body.classList.add('logged-in');

            const data = themesData[mode];
            document.getElementById("brandTitle").innerText = data.title;
            document.getElementById("brandSub").innerText = data.subtitle;
            document.getElementById("bgImageElement").src = convertDriveLink(data.rawUrl || data.url);
        }

        async function fetchAllThemes() {
            try {
                for (let m of ['rain', 'midnight', 'warm']) {
                    let snap = await getDoc(doc(db, "settings", "theme_" + m));
                    if(snap.exists()) {
                        let d = snap.data();
                        if(d.url) themesData[m].url = d.url;
                        if(d.rawUrl) themesData[m].rawUrl = d.rawUrl;
                    }
                }
            } catch(e) {}
            setMode(currentMode);
        }

        window.handleTitleClick = function() {
            if (sessionStorage.getItem('ahtao_admin_auth') === 'true') {
                document.getElementById("adminModal").style.display = "flex";
                loadAdminThemeFields();
            } else {
                let pass = prompt("🔐 กรุณากรอกรหัสผ่านเพื่อเข้าสู่หลังบ้าน:");
                if (pass === ADMIN_PASS) {
                    sessionStorage.setItem('ahtao_admin_auth', 'true');
                    document.body.classList.add('logged-in');
                    document.getElementById("adminModal").style.display = "flex";
                    loadAdminThemeFields();
                } else if (pass !== null) {
                    alert("❌ รหัสผ่านไม่ถูกต้อง");
                }
            }
        }

        window.closeAdmin = function() { document.getElementById("adminModal").style.display = "none"; }

        window.loadAdminThemeFields = function() {
            const selected = document.getElementById("adminThemeSelect").value;
            const data = themesData[selected];
            document.getElementById("bannerUrlInput").value = data.rawUrl || data.url || '';
        }

        window.saveBannerData = async function() {
            const theme = document.getElementById("adminThemeSelect").value;
            let rawUrl = document.getElementById("bannerUrlInput").value.trim();
            let url = convertDriveLink(rawUrl);
            try {
                await setDoc(doc(db, "settings", "theme_" + theme), { url, rawUrl, title: themesData[theme].title, subtitle: themesData[theme].subtitle });
                alert("อัปเดตภาพแบนเนอร์สำเร็จ!");
                location.reload();
            } catch(e) { alert("เกิดข้อผิดพลาด: " + e.message); }
        }

        window.addTag = function(tag) {
            const input = document.getElementById("postTags");
            input.value = input.value ? input.value + ", " + tag : tag;
        }

        let allPostsGlobal = [];
        async function loadPosts() {
            const container = document.getElementById("postsContainer");
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-style: italic;">พื้นที่ยังว่างเปล่า...</p>`;
                    return;
                }
                
                allPostsGlobal = [];
                querySnapshot.forEach((docSnap) => { allPostsGlobal.push({ id: docSnap.id, ...docSnap.data() }); });
                allPostsGlobal.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                renderPostsList(allPostsGlobal);
            } catch (e) { container.innerHTML = `<p style="text-align: center; color: #ff6b6b;">ไม่สามารถโหลดข้อมูลได้...</p>`; }
        }

        function renderPostsList(postsArray) {
            const container = document.getElementById("postsContainer");
            container.innerHTML = "";
            postsArray.forEach((post) => {
                let textHtml = post.type === 'poem' 
                    ? `<div class="poem">${post.content ? post.content.replace(/\n/g, '<br>') : ''}</div>` 
                    : `<p>${post.content ? post.content.replace(/\n/g, '<br>') : ''}</p>`;

                let imgHtml = post.imageUrl ? `<img src="${convertDriveLink(post.imageUrl)}" class="post-image" alt="Memory" loading="lazy">` : '';
                let tagsHtml = "";
                if (post.tags) {
                    const tagsList = post.tags.split(',').map(tag => tag.trim()).filter(tag => tag);
                    tagsHtml = `<div class="post-tags">${tagsList.map(tag => `<span class="post-tag">${tag}</span>`).join('')}</div>`;
                }

                let contentWrapper = post.isBlurred 
                    ? `<div class="blur-content"><div class="blur-hint">แตะเพื่อดูความรู้สึก</div>${imgHtml}${textHtml}</div>` 
                    : `${imgHtml}${textHtml}`;

                let hugsCount = post.hugs || 0;

                container.innerHTML += `
                    <article class="entry-card" id="post-${post.id}">
                        ${post.date ? `<span class="date">${post.date}</span>` : ''}
                        ${contentWrapper}
                        <div class="post-footer">
                            ${tagsHtml}
                            <div class="post-actions">
                                <button class="action-btn" onclick="sendHug('${post.id}')" title="ส่งกอด">🤍 <span id="hug-count-${post.id}">${hugsCount}</span></button>
                                <button class="action-btn" onclick="shareAsCard(this)" title="คลิกเพื่อสร้างการ์ดรูปภาพพร้อมเครดิตสำหรับแชร์">📤 แชร์การ์ด</button>
                                <button class="action-btn" onclick="copyPostLink('${post.id}')" title="คัดลอกลิงก์โพสต์นี้">🔗 ลิงก์</button>
                                <button class="delete-btn" onclick="deletePost('${post.id}')" title="ลบโพสต์">✕ ลบ</button>
                            </div>
                        </div>
                    </article>
                `;
            });
        }

        window.randomMemory = function() {
            if (allPostsGlobal.length === 0) return;
            const randomPost = allPostsGlobal[Math.floor(Math.random() * allPostsGlobal.length)];
            const el = document.getElementById(`post-${randomPost.id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.transition = "background 0.5s";
                el.style.background = "rgba(255,255,255,0.05)";
                setTimeout(() => { el.style.background = "transparent"; }, 1500);
            }
        }

        window.sendHug = async function(id) {
            try {
                const postRef = doc(db, "posts", id);
                await updateDoc(postRef, { hugs: increment(1) });
                const countSpan = document.getElementById(`hug-count-${id}`);
                if(countSpan) countSpan.innerText = parseInt(countSpan.innerText || 0) + 1;
            } catch(e) {}
        }

        window.copyPostLink = function(id) {
            const link = SITE_URL + "#post-" + id;
            navigator.clipboard.writeText(link).then(() => {
                alert("📋 คัดลอกลิงก์โพสต์เรียบร้อย ส่งให้เพื่อนได้เลย!");
            });
        }

        // ระบบแชร์เป็นการ์ดรูปภาพ แก้ไขการจัดวางและขนาดตัวหนังสือให้สวยงาม อ่านง่าย ชัดเจน
        window.shareAsCard = function(btn) {
            const card = btn.closest('.entry-card');
            const textEl = card.querySelector('p, .poem');
            const poemText = textEl ? textEl.innerText : "";

            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');

            // พื้นหลังดำสนิทมินิมอล
            ctx.fillStyle = "#0c0c0c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // กรอบขอบการ์ดบางๆ
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 4;
            ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

            // ตั้งค่าฟอนต์บทกวีให้อยู่ตรงกลางพอดี ไม่ล้นขอบ
            ctx.fillStyle = "#e1e1e1";
            ctx.font = "italic 40px 'Sarabun', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            function wrapText(context, text, x, y, maxWidth, lineHeight) {
                let paragraphs = text.split('\n');
                let lines = [];
                for (let p of paragraphs) {
                    let words = p.split(' ');
                    let line = '';
                    for (let n = 0; n < words.length; n++) {
                        let testLine = line + words[n] + ' ';
                        let metrics = context.measureText(testLine);
                        if (metrics.width > maxWidth && n > 0) {
                            lines.push(line);
                            line = words[n] + ' ';
                        } else {
                            line = testLine;
                        }
                    }
                    lines.push(line);
                }
                let startY = y - (lines.length * lineHeight) / 2;
                for (let k = 0; k < lines.length; k++) {
                    context.fillText(lines[k], x, startY + (k * lineHeight));
                }
            }

            // คำนวณความกว้างและเว้นบรรทัดให้อ่านสบายตา
            wrapText(ctx, poemText, canvas.width / 2, canvas.height / 2 - 50, 800, 70);

            // เครดิตด้านล่าง (ปรับให้ใหญ่และสว่างขึ้น อ่านง่ายชัดเจน 100%)
            ctx.fillStyle = "#ffffff";
            ctx.font = "500 28px 'Sarabun', sans-serif";
            ctx.fillText("✦ AHTAO SPACE", canvas.width / 2, canvas.height - 130);

            ctx.fillStyle = "#aaaaaa";
            ctx.font = "22px 'Sarabun', sans-serif";
            ctx.fillText(SITE_URL, canvas.width / 2, canvas.height - 90);

            canvas.toBlob(async (blob) => {
                const file = new File([blob], "Ahtao-Space-Poem.png", { type: "image/png" });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ files: [file], title: 'AHTAO SPACE', text: 'ความรู้สึกจาก AHTAO SPACE' });
                        return;
                    } catch (err) {}
                }

                const link = document.createElement('a');
                link.download = 'ahtao-space-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                alert("📥 สร้างการ์ดรูปภาพบทกวีพร้อมเครดิตเว็บเรียบร้อย!\nนำรูปไปโพสต์ลง IG Story ได้เลยค่ะ");
            }, 'image/png');
        }

        window.createPost = async function() {
            const type = document.getElementById("postType").value;
            const imageUrl = document.getElementById("postImageUrl").value.trim();
            const content = document.getElementById("postContent").value.trim();
            const tags = document.getElementById("postTags").value.trim();
            const isBlurred = document.getElementById("postBlur").checked;

            if(!content && !imageUrl) {
                alert("กรุณากรอกเนื้อหาหรือใส่รูปภาพอย่างน้อยหนึ่งอย่างค่ะ");
                return;
            }

            const today = new Date();
            const date = today.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

            try {
                await addDoc(collection(db, "posts"), {
                    type, date, imageUrl, content, tags, isBlurred,
                    hugs: 0,
                    createdAt: new Date()
                });
                alert("บันทึกความรู้สึกสำเร็จ!");
                location.reload();
            } catch (e) { alert("เกิดข้อผิดพลาด: " + e.message); }
        }

        window.deletePost = async function(id) {
            if (confirm("ลบความรู้สึกนี้ทิ้งใช่หรือไม่?")) {
                try { await deleteDoc(doc(db, "posts", id)); location.reload(); }
                catch (e) { alert("เกิดข้อผิดพลาด: " + e.message); }
            }
        }

        initParticles();
        fetchAllThemes();
        loadPosts();
    </script>
</body>
</html>
